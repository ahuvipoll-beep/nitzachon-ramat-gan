<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניצחון רמת גן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;900&family=Heebo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--gold-1:#fff3c8;--gold-2:#f0cc72;--gold-3:#c99433;--gold-4:#7d5414;--ink:#fff;
    --serif:'Frank Ruhl Libre','David',serif;--sans:'Heebo','Segoe UI',Arial,sans-serif;color-scheme:dark}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
  .backdrop{position:fixed;inset:-60px;background-size:cover;background-position:center;filter:blur(40px) brightness(.45)}
  #cv{box-shadow:0 0 80px rgba(0,0,0,.6)}
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  #cv{width:1920px;height:1080px;position:absolute;left:50%;top:50%;overflow:hidden;transform-origin:center;background:#120c05}

  /* scene in image space: 1536x1024 photo scaled to cover 1920x1080 */
  .scene{position:absolute;left:0;top:-100px;width:1920px;height:1280px;transform-origin:50% 40%;
    animation:kb 28s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translateY(10px)}}
  .scene img.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .flicker{position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 15%,rgba(255,200,110,.18),transparent 70%);
    mix-blend-mode:screen;animation:fl 5s ease-in-out infinite}
  @keyframes fl{0%,100%{opacity:.6}35%{opacity:1}60%{opacity:.75}80%{opacity:.95}}

  /* embroidery on the banner */
  .banner{position:absolute;left:37.4%;width:21%;top:24%;height:41%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:6px}
  .emb{font-family:var(--serif);font-weight:900;line-height:1;
    background:linear-gradient(170deg,var(--gold-1) 0%,var(--gold-2) 30%,var(--gold-3) 55%,var(--gold-2) 75%,var(--gold-4) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(60,35,5,.9)) drop-shadow(0 4px 6px rgba(0,0,0,.6));position:relative}
  /* thread texture + travelling sheen */
  .emb::after{content:attr(data-t);position:absolute;inset:0;color:transparent;
    background:repeating-linear-gradient(120deg,rgba(255,255,255,0) 0 2px,rgba(255,255,255,.28) 2px 3px),
               linear-gradient(100deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%);
    background-size:auto,300% 100%;-webkit-background-clip:text;background-clip:text;mix-blend-mode:overlay;
    animation:sheen 5s ease-in-out infinite}
  @keyframes sheen{0%{background-position:0 0,150% 0}60%,100%{background-position:0 0,-150% 0}}
  .l1{font-size:58px;font-weight:500}
  .l2{font-size:132px;margin-top:-4px}
  .orn{width:300px;height:34px;margin:8px 0}
  .l3{font-size:60px}
  .l4{font-family:var(--sans);font-weight:700;font-size:30px;letter-spacing:6px;color:var(--gold-2);margin-top:12px;
    text-shadow:0 2px 0 rgba(60,35,5,.9)}

  #fx{position:absolute;inset:0;pointer-events:none}

  /* bottom headline band */
  .band{position:absolute;left:0;right:0;bottom:0;height:300px;
    background:linear-gradient(to top,rgba(10,5,0,.92) 0%,rgba(10,5,0,.65) 55%,transparent 100%)}
  .msg{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-family:var(--serif);font-weight:900;font-size:128px;line-height:1.1;
    background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 40%,var(--gold-3) 75%,var(--gold-4) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:1.5px rgba(255,240,200,.35);
    filter:drop-shadow(0 6px 0 rgba(70,40,5,.95)) drop-shadow(0 10px 24px rgba(0,0,0,.85));
    opacity:0;transform:scale(1.8);transition:opacity .35s}
  .msg.on{opacity:1;animation:stamp .9s cubic-bezier(.2,1.6,.4,1) forwards, glow 2.4s .9s ease-in-out infinite}
  @keyframes stamp{0%{transform:scale(1.8);letter-spacing:30px}100%{transform:scale(1);letter-spacing:0}}
  @keyframes glow{0%,100%{filter:drop-shadow(0 6px 0 rgba(70,40,5,.95)) drop-shadow(0 10px 24px rgba(0,0,0,.85)) drop-shadow(0 0 0 rgba(255,210,120,0));transform:scale(1)}
    50%{filter:drop-shadow(0 6px 0 rgba(70,40,5,.95)) drop-shadow(0 10px 24px rgba(0,0,0,.85)) drop-shadow(0 0 34px rgba(255,210,120,.85));transform:scale(1.04)}}
  .msg::after{content:attr(data-t);position:absolute;inset:0;color:transparent;-webkit-text-stroke:0;
    background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;animation:sheen2 2.6s ease-in-out infinite}
  @keyframes sheen2{0%{background-position:150% 0}70%,100%{background-position:-150% 0}}
  .msg.small{font-family:var(--sans);font-weight:700;font-size:56px;bottom:60px;-webkit-text-stroke:0}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>

        <defs><linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="#c99433" stop-opacity="0"/><stop offset=".3" stop-color="#f0cc72"/><stop offset=".5" stop-color="#fff3c8"/><stop offset=".7" stop-color="#f0cc72"/><stop offset="1" stop-color="#c99433" stop-opacity="0"/></linearGradient></defs>
        <rect x="10" y="15.5" width="110" height="3" fill="url(#og)"/><rect x="180" y="15.5" width="110" height="3" fill="url(#og)" transform="rotate(180 235 17)"/>
        <path d="M150 3l8 14-8 14-8-14z" fill="#f0cc72"/><circle cx="128" cy="17" r="4" fill="#f0cc72"/><circle cx="172" cy="17" r="4" fill="#f0cc72"/>

    <div class="msg" data-t="הניצחון של רמת גן!">הניצחון של רמת גן!</div>
    <div class="msg" data-t="הגביע הוא שלנו!">הגביע הוא שלנו!</div>
    <div class="msg small" data-t="תודה לסניף בית שמש על תחרות ספורטיבית - נתראה בסיבוב הבא">תודה לסניף בית שמש על תחרות ספורטיבית - נתראה בסיבוב הבא</div>

</div></div>

<script>
  const cv=document.getElementById('cv');
  function fit(){cv.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}
  addEventListener('resize',fit);fit();
  addEventListener('dblclick',()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})});

  const msgs=[...document.querySelectorAll('.msg')];let mi=0;
  setInterval(()=>{msgs[mi].classList.remove('on');mi=(mi+1)%msgs.length;msgs[mi].classList.add('on');if(!msgs[mi].classList.contains('small')&&window.pop)pop()},5000);

  const c=document.getElementById('fx'),x=c.getContext('2d');c.width=1920;c.height=1080;
  // chandelier & candle points (screen coords after cover crop)
  const LIGHTS=[[540,40],[1325,40],[610,250],[1205,250],[90,350],[1735,350],[270,410],[1555,410],[530,100],[1310,100],[470,170],[1380,170]];
  const S=[];
  function twinkle(){const [lx,ly]=LIGHTS[Math.random()*LIGHTS.length|0];
    S.push({x:lx+(Math.random()-.5)*150,y:ly+(Math.random()-.5)*110,life:0,max:40+Math.random()*50,s:8+Math.random()*18})}
  const GOLD=[[255,238,185],[244,208,120],[214,164,72],[170,115,35]];
  const P=[];
  function flake(burst){const col=GOLD[Math.random()*4|0];
    P.push({x:Math.random()*1920,y:burst?-20-Math.random()*500:-20,vy:1+Math.random()*1.8,vx:(Math.random()-.5)*.5,
      w:7+Math.random()*9,h:10+Math.random()*12,r:Math.random()*6,vr:(Math.random()-.5)*.08,ph:Math.random()*6,col})}
  for(let k=0;k<140;k++)flake(true);
  window.pop=()=>{for(let k=0;k<90;k++){const a=Math.random()*Math.PI*2,v=6+Math.random()*12;flake(false);const p=P[P.length-1];p.x=960+(Math.random()-.5)*500;p.y=980;p.vx=Math.cos(a)*v*.8;p.vy=-Math.abs(Math.sin(a))*v-6}};
  setInterval(()=>{for(let k=0;k<120;k++)flake(true)},10000);

  function star(px,py,s,a){x.save();x.globalAlpha=a;x.translate(px,py);
    const g=x.createRadialGradient(0,0,0,0,0,s*1.4);g.addColorStop(0,'rgba(255,248,220,.9)');g.addColorStop(1,'rgba(255,220,140,0)');
    x.fillStyle=g;x.beginPath();x.arc(0,0,s*1.4,0,7);x.fill();
    x.fillStyle='#fffbe8';x.beginPath();x.moveTo(0,-s*2);x.lineTo(s*.18,0);x.lineTo(0,s*2);x.lineTo(-s*.18,0);x.closePath();x.fill();
    x.beginPath();x.moveTo(-s*2,0);x.lineTo(0,s*.18);x.lineTo(s*2,0);x.lineTo(0,-s*.18);x.closePath();x.fill();x.restore()}

  function tick(){x.clearRect(0,0,1920,1080);
    if(Math.random()<.35)twinkle();
    for(let k=S.length-1;k>=0;k--){const s=S[k];s.life++;if(s.life>s.max){S.splice(k,1);continue}
      star(s.x,s.y,s.s*Math.sin(Math.PI*s.life/s.max),Math.sin(Math.PI*s.life/s.max))}
    if(P.length<220&&Math.random()<.4)flake(false);
    for(let k=P.length-1;k>=0;k--){const p=P[k];p.ph+=.05;p.vx*=.985;p.vy=p.vy<1?p.vy+.25:Math.min(p.vy+.02,2.8);p.x+=p.vx+Math.sin(p.ph)*1.2;p.y+=p.vy;p.r+=p.vr;
      if(p.y>1110){P.splice(k,1);continue}
      const sc=Math.cos(p.ph),sh=.5+.5*Math.abs(sc),[r,g,b]=p.col;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(sc,1);x.fillStyle=`rgb(${r*sh|0},${g*sh|0},${b*sh|0})`;
      x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
    requestAnimationFrame(tick)}
  tick();
</script>
